name: Simple Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf qemu-system-misc make
    - name: Build
      run: |
        cd builder-syscall
        make PLATFORM=qemu
    
    - name: Test in QEMU
      run: |
        cd builder-syscall
        
        timeout 10s qemu-system-riscv64 -machine virt -nographic -bios image_qemu.bin 2>&1 | tee output.txt || true

        if grep -a -q "coded by Team 42" output.txt && grep -a -q "Simon says~" output.txt; then
          echo "Тест пройден!"
          exit 0
        else
          echo "Ожидаемые сообщения не найдены. Вывожу лог со скрытыми символами для дебага:"
          cat -v output.txt
          exit 1
        fi
