name: Simple Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf qemu-system-misc make python3-pexpect python3-pytest

    - name: Build and test
      run: |
        cd builder-syscall
        make test

    - name: Verify hex0 file creation
      run: |
        cd builder-syscall
        # Проверяем существование файла. Если его нет, шаг завершится с ошибкой (exit 1).
        test -f hex0 || (echo "Ошибка: Файл hex0 не найден после сборки!" && exit 1)
        echo "Успех: Файл hex0 на месте."

    - name: Run tests
      run: |
        cd builder-syscall
        make test
